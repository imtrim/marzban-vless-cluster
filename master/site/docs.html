    <h1>Fetch by hash. Do not guess paths.</h1>
    <p class="lede">Public objects are under <code>/o/&lt;sha256&gt;</code>. Unsigned paths return 404. There is no directory listing and no upload API on this node.</p>
    <p>Cache-Control for hashed objects is <code>public, max-age=31536000, immutable</code>.</p>
